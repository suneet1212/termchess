name: test-setup

services:
  peer1:
    container_name: peer-only-firewall-1
    image: python:3-alpine
    network_mode: none
    stdin_open: true
    tty: true
    volumes:
      - type: volume
        source: termchess-code
        target: /tmp/code
        read_only: true

  peer2:
    container_name: peer-only-firewall-2
    image: python:3-alpine
    network_mode: none
    stdin_open: true
